<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Live cast · shpellcast</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body data-state="connecting">
  <header class="top">
    <a class="mark" href="/">shpellcast</a>
    <div class="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="state">Connecting</span>
    </div>
    <div class="watchers" id="watchers"></div>
  </header>
  <main id="main">
    <section class="cast-message" id="empty" aria-labelledby="waiting-title" hidden>
      <span class="waiting-mark" aria-hidden="true">✧</span>
      <h1 id="waiting-title">Waiting for output.</h1>
      <p>The portal is open. The first line will appear here as soon as the command writes it.</p>
    </section>
    <section class="cast-message" id="faded" aria-labelledby="faded-title" hidden>
      <h1 id="faded-title">This cast has faded.</h1>
      <p>The link may have expired. Ask the sender for a new one or <a href="/#usage">start your own cast</a>.</p>
    </section>
    <div class="output" id="out" role="region" aria-label="Command output"></div>
    <p class="seal" id="seal" hidden></p>
  </main>

  <nav class="dock" aria-label="Viewer actions">
    <button id="jump" type="button" hidden>Jump to live</button>
    <a id="raw" href="#" hidden>Download raw</a>
  </nav>

  <footer class="foot">Built with AIT Foundry</footer>
  <script src="/assets/viewer.js" defer></script>
</body>
</html>
